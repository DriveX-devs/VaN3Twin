<?xml version="1.0" encoding="UTF-8"?>
<sumoConfiguration xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xsi:noNamespaceSchemaLocation="http://sumo.dlr.de/xsd/sumoConfiguration.xsd">
    <input>
        <net-file value="v2p_map_t2c.net.xml"/>
        <route-files value="pedestrians.rou.xml,vehicles.rou.xml"/>
    </input>
    <output>
        <collision-output value="collisions.xml"/>
    </output>
    <simulation>
        <time>
            <begin value="0"/>
            <end value="55"/>
            <step-length value="0.01"/>
        </time>
        <processing>
            <intermodal-collision.action value="warn"/>
            <collision.mingap-factor value="0"/>
            <collision.check-junctions value="true"/>
        </processing>
        <gui_only>
            <!--delay value="300"/-->
        </gui_only>
        <report>
            <error-log value="errorLog.log"/>
        </report>
    </simulation>
</sumoConfiguration>
